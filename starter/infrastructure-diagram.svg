<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Udagram AWS Infrastructure Diagram</title>
  <desc id="desc">Highly available Udagram infrastructure with an application load balancer, two public subnets, two private subnets, NAT gateways, an auto scaling group, private EC2 instances, and an S3 bucket.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#edf4f2"/>
    </linearGradient>
    <linearGradient id="vpc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fafb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#17324d" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#16805c"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 32px 'Segoe UI', sans-serif; fill: #102a43; }
      .subtitle { font: 400 16px 'Segoe UI', sans-serif; fill: #526579; }
      .label { font: 700 17px 'Segoe UI', sans-serif; fill: #17324d; }
      .small { font: 400 14px 'Segoe UI', sans-serif; fill: #526579; }
      .tiny { font: 600 12px 'Segoe UI', sans-serif; fill: #526579; }
      .resource { font: 700 14px 'Segoe UI', sans-serif; fill: #17324d; }
      .resourceLight { font: 600 12px 'Segoe UI', sans-serif; fill: #526579; }
      .route { fill: none; stroke-width: 3; marker-end: url(#arrowBlue); }
      .contentRoute { fill: none; stroke: #16805c; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrowGreen); }
      .egressRoute { fill: none; stroke: #d97706; stroke-width: 2.5; stroke-dasharray: 7 6; marker-end: url(#arrowOrange); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#background)"/>
  <circle cx="1450" cy="90" r="170" fill="#d8eee9" opacity="0.65"/>
  <circle cx="80" cy="900" r="220" fill="#e2ebfa" opacity="0.7"/>

  <text x="70" y="72" class="title">Udagram AWS Infrastructure</text>
  <text x="70" y="103" class="subtitle">Two-stack, highly available deployment with private application servers and S3-backed static content</text>

  <!-- Internet -->
  <g filter="url(#shadow)">
    <rect x="70" y="215" width="190" height="100" rx="18" fill="#102a43"/>
    <path d="M130 265c0-22 18-40 40-40s40 18 40 40-18 40-40 40-40-18-40-40z" fill="none" stroke="#8bd3c7" stroke-width="3"/>
    <path d="M130 265h80M170 225c10 11 15 24 15 40s-5 29-15 40M170 225c-10 11-15 24-15 40s5 29 15 40" fill="none" stroke="#8bd3c7" stroke-width="2"/>
    <text x="170" y="345" text-anchor="middle" class="label">Public Internet</text>
  </g>

  <!-- S3 -->
  <g filter="url(#shadow)">
    <rect x="1325" y="190" width="205" height="130" rx="16" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <path d="M1390 230h70v55h-70z" fill="#f59e0b" opacity="0.22" stroke="#b45309" stroke-width="3"/>
    <path d="M1390 230l35-15 35 15-35 15zM1390 258l35 15 35-15M1425 245v28" fill="none" stroke="#b45309" stroke-width="3"/>
    <text x="1427" y="302" text-anchor="middle" class="resource">S3 static content</text>
    <text x="1427" y="340" text-anchor="middle" class="small">Public-read bucket</text>
  </g>

  <!-- VPC -->
  <rect x="335" y="145" width="900" height="775" rx="28" fill="url(#vpc)" stroke="#4b6580" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="365" y="165" width="170" height="38" rx="19" fill="#e6eef8"/>
  <text x="450" y="190" text-anchor="middle" class="label">Udagram VPC</text>
  <text x="575" y="190" class="small">Network stack exports VPC and subnet IDs to the application stack</text>

  <!-- Public subnet bands -->
  <rect x="370" y="225" width="830" height="220" rx="20" fill="#eef6ff" stroke="#8bb9ef" stroke-width="2"/>
  <text x="395" y="258" class="label">Public subnets</text>
  <text x="395" y="282" class="small">Internet-facing resources and NAT gateways</text>

  <rect x="395" y="300" width="365" height="115" rx="14" fill="#ffffff" stroke="#adc9ea" stroke-width="2"/>
  <text x="420" y="330" class="resource">Public subnet 1</text>
  <text x="420" y="352" class="resourceLight">Availability Zone 1</text>
  <rect x="420" y="368" width="135" height="32" rx="8" fill="#fff4df" stroke="#e8a323"/>
  <text x="487" y="389" text-anchor="middle" class="tiny">NAT Gateway 1</text>

  <rect x="795" y="300" width="365" height="115" rx="14" fill="#ffffff" stroke="#adc9ea" stroke-width="2"/>
  <text x="820" y="330" class="resource">Public subnet 2</text>
  <text x="820" y="352" class="resourceLight">Availability Zone 2</text>
  <rect x="820" y="368" width="135" height="32" rx="8" fill="#fff4df" stroke="#e8a323"/>
  <text x="887" y="389" text-anchor="middle" class="tiny">NAT Gateway 2</text>

  <!-- ALB -->
  <g filter="url(#shadow)">
    <rect x="560" y="270" width="410" height="80" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <path d="M595 293h36v36h-36zM647 293h36v36h-36zM699 293h36v36h-36z" fill="none" stroke="#2563eb" stroke-width="3"/>
    <path d="M613 303v16M665 303v16M717 303v16" stroke="#2563eb" stroke-width="3"/>
    <text x="770" y="305" class="resource">Application Load Balancer</text>
    <text x="770" y="328" class="resourceLight">Internet-facing | HTTP :80</text>
  </g>

  <!-- Private subnet bands -->
  <rect x="370" y="480" width="830" height="365" rx="20" fill="#effaf4" stroke="#86c9a7" stroke-width="2"/>
  <text x="395" y="515" class="label">Private subnets</text>
  <text x="395" y="539" class="small">EC2 application fleet managed by Auto Scaling</text>

  <rect x="395" y="565" width="365" height="235" rx="14" fill="#ffffff" stroke="#a5d9bd" stroke-width="2"/>
  <text x="420" y="597" class="resource">Private subnet 1</text>
  <text x="420" y="620" class="resourceLight">Availability Zone 1</text>
  <g>
    <rect x="420" y="650" width="145" height="55" rx="10" fill="#e5f5ed" stroke="#16805c"/>
    <rect x="585" y="650" width="145" height="55" rx="10" fill="#e5f5ed" stroke="#16805c"/>
    <text x="492" y="675" text-anchor="middle" class="resource">EC2 instance 1</text>
    <text x="492" y="693" text-anchor="middle" class="tiny">nginx web server</text>
    <text x="657" y="675" text-anchor="middle" class="resource">EC2 instance 2</text>
    <text x="657" y="693" text-anchor="middle" class="tiny">nginx web server</text>
  </g>

  <rect x="795" y="565" width="365" height="235" rx="14" fill="#ffffff" stroke="#a5d9bd" stroke-width="2"/>
  <text x="820" y="597" class="resource">Private subnet 2</text>
  <text x="820" y="620" class="resourceLight">Availability Zone 2</text>
  <g>
    <rect x="820" y="650" width="145" height="55" rx="10" fill="#e5f5ed" stroke="#16805c"/>
    <rect x="985" y="650" width="145" height="55" rx="10" fill="#e5f5ed" stroke="#16805c"/>
    <text x="892" y="675" text-anchor="middle" class="resource">EC2 instance 3</text>
    <text x="892" y="693" text-anchor="middle" class="tiny">nginx web server</text>
    <text x="1057" y="675" text-anchor="middle" class="resource">EC2 instance 4</text>
    <text x="1057" y="693" text-anchor="middle" class="tiny">nginx web server</text>
  </g>

  <!-- Shared resources -->
  <rect x="405" y="865" width="300" height="35" rx="17" fill="#edf2f7" stroke="#9aabbc"/>
  <text x="555" y="888" text-anchor="middle" class="tiny">Auto Scaling Group: min 4 | desired 4 | max 4</text>
  <rect x="730" y="865" width="220" height="35" rx="17" fill="#edf2f7" stroke="#9aabbc"/>
  <text x="840" y="888" text-anchor="middle" class="tiny">Launch Template: Ubuntu 22</text>
  <rect x="975" y="865" width="190" height="35" rx="17" fill="#edf2f7" stroke="#9aabbc"/>
  <text x="1070" y="888" text-anchor="middle" class="tiny">t2.micro instances</text>

  <!-- Security groups -->
  <g filter="url(#shadow)">
    <rect x="70" y="570" width="220" height="120" rx="14" fill="#fff1f2" stroke="#e87986" stroke-width="2"/>
    <text x="180" y="600" text-anchor="middle" class="resource">ALB security group</text>
    <text x="180" y="627" text-anchor="middle" class="small">Inbound: HTTP 80</text>
    <text x="180" y="650" text-anchor="middle" class="small">Source: 0.0.0.0/0</text>
    <text x="180" y="673" text-anchor="middle" class="tiny">Outbound: unrestricted</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="70" y="730" width="220" height="120" rx="14" fill="#fff1f2" stroke="#e87986" stroke-width="2"/>
    <text x="180" y="760" text-anchor="middle" class="resource">Web server security group</text>
    <text x="180" y="787" text-anchor="middle" class="small">Inbound: HTTP 80</text>
    <text x="180" y="810" text-anchor="middle" class="small">Source: ALB only</text>
    <text x="180" y="833" text-anchor="middle" class="tiny">Outbound: unrestricted</text>
  </g>

  <!-- Internet gateway and routes -->
  <g filter="url(#shadow)">
    <rect x="350" y="35" width="245" height="70" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="472" y="64" text-anchor="middle" class="resource">Internet Gateway</text>
    <text x="472" y="87" text-anchor="middle" class="resourceLight">Public route table</text>
  </g>

  <!-- arrows -->
  <path d="M260 265 H350" class="route"/>
  <path d="M472 105 V220 H765 V270" class="route"/>
  <path d="M472 105 V220 H487 V368" class="route"/>
  <path d="M472 105 V220 H887 V368" class="route"/>
  <path d="M645 350 V480" class="route"/>
  <path d="M487 415 V545 H575 V650" class="egressRoute"/>
  <path d="M887 415 V545 H980 V650" class="egressRoute"/>
  <path d="M970 310 C1080 310 1100 410 1100 480" class="route"/>
  <path d="M1100 480 V545 H1057 V650" class="route"/>
  <path d="M1325 255 H1210 V620 H1130 V650" class="contentRoute"/>
  <path d="M1210 620 H730 V650" class="contentRoute"/>
  <path d="M290 625 H560 V310" fill="none" stroke="#e87986" stroke-width="2" stroke-dasharray="5 5"/>
  <path d="M290 790 H420 V678" fill="none" stroke="#e87986" stroke-width="2" stroke-dasharray="5 5"/>

  <!-- legend -->
  <g transform="translate(1325 430)">
    <text x="0" y="0" class="label">Legend</text>
    <line x1="0" y1="25" x2="48" y2="25" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <text x="62" y="30" class="small">HTTP / network route</text>
    <line x1="0" y1="55" x2="48" y2="55" stroke="#16805c" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrowGreen)"/>
    <text x="62" y="60" class="small">S3 content flow</text>
    <line x1="0" y1="85" x2="48" y2="85" stroke="#d97706" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrowOrange)"/>
    <text x="62" y="90" class="small">Private egress via NAT</text>
  </g>
</svg>
